name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: lint (errors fail the job)
        run: pnpm lint
      - name: type check
        run: npx tsc --noEmit
      - name: engine self check
        run: pnpm test
      - name: build
        run: pnpm build

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: forge-std
        run: test -f lib/forge-std/src/Test.sol || forge install foundry-rs/forge-std
      - run: forge build
      - name: forge test (84 tests)
        run: forge test -vv
